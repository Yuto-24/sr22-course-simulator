name: sr22-course-simulator

x-build-args: &build-args
  PYTHON_VERSION: "${PYTHON_VERSION:-3.12}"
  APP_UID: "${LOCAL_UID:-1000}"
  APP_GID: "${LOCAL_GID:-1000}"

services:
  notebook:
    image: sr22-course-simulator:notebook
    build:
      context: .
      target: notebook
      args: *build-args
    init: true
    environment:
      SR22_ARTIFACT_DIR: /output
    command:
      - python
      - -m
      - jupyter
      - lab
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --ServerApp.root_dir=/workspace/notebooks
      - --ServerApp.token=${JUPYTER_TOKEN:?Set JUPYTER_TOKEN to a strong, non-empty random value before starting Notebook}
    ports:
      - "${JUPYTER_HOST:-127.0.0.1}:${JUPYTER_PORT:-8888}:8888"
    volumes:
      - type: bind
        source: ./notebooks
        target: /workspace/notebooks
      - type: bind
        source: ./artifacts
        target: /output

  simulator:
    image: sr22-course-simulator:local
    build:
      context: .
      target: runtime
      args: *build-args
    command: ["--mode", "guided", "--kml", "/output/guided-spiral.kml"]
    volumes:
      - type: bind
        source: ./artifacts
        target: /output

  test:
    image: sr22-course-simulator:test
    build:
      context: .
      target: test
      args: *build-args
