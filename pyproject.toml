[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sr22-course-simulator"
version = "0.1.0"
description = "Source-aware, quasi-steady SR22 training-course trajectory simulator"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "sr22-course-simulator contributors"}]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.8",
    "nbconvert>=7.16",
]
dev = ["pytest>=8"]

[project.scripts]
sr22-spiral-demo = "sr22_course_simulator.examples.spiral_descent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sr22_course_simulator = ["data/poh/canonical/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
